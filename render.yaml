# Render blueprint: web, worker and Postgres, all in Frankfurt because the data
# is Swedish rental listings and personal data should stay in the EU.
#
# Read docs/DEPLOY.md before the first deploy: a few values have to be supplied
# by hand (sync: false). Uploads go on a disk, so no bucket is needed to start.

databases:
  - name: hyrabostad-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "17"
    # PostGIS is created by src/db/migrate.ts on the first migration, which the
    # web service runs before it starts. Render supports the extension on 13+.

services:
  - type: web
    name: hyrabostad
    runtime: node
    region: frankfurt
    plan: starter
    # --prod=false because the worker and the migration runner need tsx, and the
    # Next build needs typescript and tailwind, all of which are devDependencies.
    # Render sets NODE_ENV=production, which would otherwise skip them.
    # Migrations and reference data run inside the build, before `next build`:
    # the build prerenders pages that read the database, and on a fresh
    # database the tables would not exist yet. Both commands are idempotent.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm db:migrate && pnpm db:reference && pnpm build
    # Kept as a safety net (idempotent) so the schema is never behind the code
    # serving it even when a build is served from cache.
    preDeployCommand: pnpm db:migrate && pnpm db:reference
    startCommand: pnpm start
    healthCheckPath: /api/health
    # A persistent disk pins the service to one instance and makes each deploy
    # a few seconds of handover instead of zero-downtime. Both are accepted for
    # now: the rate limiter already needs one instance. Turn on snapshots when
    # creating it; that is the backup.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # corepack asks before downloading the pinned pnpm; a build has nobody to
      # answer, and hangs. This answers yes.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase: { name: hyrabostad-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Both of these are baked into the build (NEXT_PUBLIC_*) and decide
      # canonicals, hreflang, the sitemap, share cards and Secure cookies, so
      # they have to be the real public origin. Set them to the custom domain
      # once it is attached, and redeploy — a stale value here is silent.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      # Two proxies stand between the caller and the app: Render fronts every
      # service with Cloudflare, and its own load balancer sits behind that, so
      # X-Forwarded-For carries "caller, cloudflare-edge". Every rate limit is
      # keyed on what this resolves (see src/lib/rate-limit.ts); with 1 the
      # limiter keys on Cloudflare's edge addresses and never throttles anyone.
      # Verify after a change: GET /api/whoami should echo your own address.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Uploaded photos live on the disk below. Only the web service touches
      # them, they are short-lived (a listing expires in weeks), and a bucket
      # would mean a third account guarding a handful of files. Move to
      # STORAGE_DRIVER=s3 when a second instance or zero-downtime deploys are
      # needed; both drivers serve through /api/uploads, so nothing else changes.
      - key: STORAGE_DRIVER
        value: disk
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Lets a listing change flush the prerendered pages it affects instead of
      # waiting out their revalidate window. Shared with the worker below.
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: SOURCE_SECRET_KEY
        generateValue: true

  - type: worker
    name: hyrabostad-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm worker
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase: { name: hyrabostad-db, property: connectionString }
      # The worker asks the web service to flush pages after a crawl, so it needs
      # the same origin and the same secret the web service generated.
      - key: NEXT_PUBLIC_SITE_URL
        fromService: { type: web, name: hyrabostad, envVarKey: NEXT_PUBLIC_SITE_URL }
      - key: REVALIDATE_SECRET
        fromService: { type: web, name: hyrabostad, envVarKey: REVALIDATE_SECRET }
      - key: SOURCE_SECRET_KEY
        fromService: { type: web, name: hyrabostad, envVarKey: SOURCE_SECRET_KEY }
      - key: BETTER_AUTH_SECRET
        fromService: { type: web, name: hyrabostad, envVarKey: BETTER_AUTH_SECRET }
      - key: BETTER_AUTH_URL
        fromService: { type: web, name: hyrabostad, envVarKey: BETTER_AUTH_URL }
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # The worker never reads or writes uploads; the startup check only wants
      # the choice stated.
      - key: STORAGE_DRIVER
        value: disk
      - key: RESEND_API_KEY
        fromService: { type: web, name: hyrabostad, envVarKey: RESEND_API_KEY }
      - key: EMAIL_FROM
        fromService: { type: web, name: hyrabostad, envVarKey: EMAIL_FROM }
      # Sentry is optional; a worker cannot copy a value the web service does
      # not have, so it is set here directly when wanted (sync: false would
      # prompt on every sync).
      - key: SENTRY_DSN
        value: ""
