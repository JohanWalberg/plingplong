services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hyrabostad-db
    environment:
      POSTGRES_USER: hyrabostad
      POSTGRES_PASSWORD: hyrabostad
      POSTGRES_DB: hyrabostad
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyrabostad"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
